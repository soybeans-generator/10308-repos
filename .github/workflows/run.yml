name: Clone Codeberg repos

on:
  schedule:
    - cron: "0 0 * * *"   # daily, 00:00 UTC
  workflow_dispatch:
    inputs:
      owner:
        description: Codeberg user/org
        default: "26"

permissions:
  contents: write

env:
  OWNER: ${{ inputs.owner || '26' }}

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: List repos
        run: |
          base="https://codeberg.org/api/v1/users/${OWNER}/repos"
          curl -fsS "${base}?limit=1" >/dev/null 2>&1 || base="https://codeberg.org/api/v1/orgs/${OWNER}/repos"
          page=1
          : > repos.txt
          while :; do
            out=$(curl -fsS "${base}?page=${page}&limit=50")
            urls=$(echo "$out" | jq -r '.[] | select(.empty == false) | "\(.name) \(.clone_url) \(.default_branch)"')
            [ -z "$urls" ] && break
            echo "$urls" >> repos.txt
            page=$((page+1))
          done
          echo "Repos found: $(wc -l < repos.txt)"

      - name: Add or update subtrees
        run: |
          mkdir -p repos
          while read -r name url branch; do
            if [ -d "repos/$name" ]; then
              git subtree pull --prefix="repos/$name" "$url" "$branch" -m "Update $name from Codeberg" \
                || echo "FAILED pull: $name"
            else
              git subtree add --prefix="repos/$name" "$url" "$branch" -m "Add $name from Codeberg" \
                || echo "FAILED add: $name"
            fi
          done < repos.txt
          rm repos.txt

      - name: Push
        run: git push
